name: Verify NumPy exercises

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  numpy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Run offline NumPy regression tests
        run: python -m unittest discover -s 02-NumPy/tests -p 'test_*.py'
